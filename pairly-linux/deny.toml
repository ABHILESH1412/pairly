# `cargo deny check` (Phase 11): known vulnerabilities, licences, and where crates come from.

[graph]
all-features = true

[advisories]
# Vulnerabilities always fail; unmaintained crates are reported for our direct dependencies.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.93
# Our own crates (GPL-3.0-or-later) aren't published; dependencies must be GPL-compatible.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
