[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
# Shared core (sibling workspace)
pairly-proto = { path = "../pairly-core/crates/pairly-proto" }
pairly-crypto = { path = "../pairly-core/crates/pairly-crypto" }
pairly-core = { path = "../pairly-core/crates/pairly-core" }
pairly-plugins = { path = "../pairly-core/crates/pairly-plugins" }
pairly-transport-lan = { path = "../pairly-core/crates/pairly-transport-lan" }
pairly-transport-relay = { path = "../pairly-core/crates/pairly-transport-relay" }
# Linux crates
pairly-dbus = { path = "crates/pairly-dbus" }
pairly-transport-bt = { path = "crates/pairly-transport-bt" }
# Third party
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
ksni = "0.3"
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
tempfile = "3"
relm4 = { version = "0.11", features = ["libadwaita", "gnome_50"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "io-std", "io-util"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Keep in sync with ../pairly-core/Cargo.toml
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# No LTO: it barely matters for a desktop app, and linking three GTK/zbus/QUIC binaries with
# LTO in parallel needs several GB of RAM.
[profile.release]
strip = "debuginfo"
