<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone screen</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #111; color: #eee; overflow: hidden; }
    .viewer { display: flex; flex-direction: column; height: 100vh; }
    .stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
    canvas { max-width: 100%; max-height: 100%; touch-action: none; cursor: pointer; background: #000; }
    canvas.pc { cursor: default; outline: none; }
    canvas.idle { visibility: hidden; }
    .status { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #ccc; }
    .status[hidden] { display: none; }
    .status .big { font-size: 42px; margin-bottom: 10px; }
    .keys { display: flex; justify-content: center; gap: 28px; padding: 8px; background: #1b1b1b; }
    .keys button { background: transparent; border: none; color: #ddd; font-size: 20px; width: 48px; height: 36px; border-radius: 10px; }
    .keys button:hover { background: #2c2c2c; }
  </style>
</head>
<body>
  <div class="viewer">
    <div class="stage">
      <canvas id="video" class="idle" tabindex="0" width="360" height="780"></canvas>
      <div class="status" id="status"><div><div class="big">📲</div><div id="status-text">Asking the phone to share its screen…</div></div></div>
    </div>
    <div class="keys">
      <button data-key="back" title="Back (or right-click)">◁</button>
      <button data-key="home" title="Home">○</button>
      <button data-key="recents" title="Recent apps">▢</button>
    </div>
  </div>
  <script src="screen.js"></script>
</body>
</html>
