[package]
name = "pairly-windows"
description = "Pairly for Windows: your phone and your PC, working as one"
version = "0.1.3"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "pairly"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"

pairly-core = { path = "../../pairly-core/crates/pairly-core" }
pairly-crypto = { path = "../../pairly-core/crates/pairly-crypto" }
pairly-plugins = { path = "../../pairly-core/crates/pairly-plugins" }
pairly-transport-lan = { path = "../../pairly-core/crates/pairly-transport-lan" }

anyhow = "1"
arboard = { version = "3", default-features = false }
enigo = "0.5"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_RemoteDesktop",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
strip = "debuginfo"
