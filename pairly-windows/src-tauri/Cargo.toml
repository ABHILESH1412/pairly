[package]
name = "pairly-windows"
description = "Pairly for Windows: your phone and your PC, working as one"
version = "0.1.6"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "pairly"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"

pairly-core = { path = "../../pairly-core/crates/pairly-core" }
pairly-crypto = { path = "../../pairly-core/crates/pairly-crypto" }
pairly-plugins = { path = "../../pairly-core/crates/pairly-plugins" }
pairly-transport-lan = { path = "../../pairly-core/crates/pairly-transport-lan" }
pairly-transport-relay = { path = "../../pairly-core/crates/pairly-transport-relay" }

anyhow = "1"
arboard = { version = "3", default-features = false }
async-trait = "0.1"
base64 = "0.22"
enigo = "0.5"
openh264 = "0.9"
png = "0.17"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-future = "0.3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
strip = "debuginfo"

# The video encoder is far too slow unoptimised, even while developing.
[profile.dev.package.openh264-sys2]
opt-level = 3
