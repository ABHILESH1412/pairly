[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
pairly-proto = { path = "crates/pairly-proto" }
pairly-crypto = { path = "crates/pairly-crypto" }
pairly-core = { path = "crates/pairly-core" }
pairly-plugins = { path = "crates/pairly-plugins" }
pairly-transport-lan = { path = "crates/pairly-transport-lan" }
pairly-transport-relay = { path = "crates/pairly-transport-relay" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
