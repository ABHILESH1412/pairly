[package]
name = "pairly-ffi"
description = "UniFFI bindings exposing the Pairly node to Kotlin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["lib", "cdylib"]
name = "pairly_ffi"

[dependencies]
pairly-core.workspace = true
pairly-crypto.workspace = true
pairly-plugins.workspace = true
pairly-transport-lan.workspace = true
pairly-transport-relay.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uniffi.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android.workspace = true
